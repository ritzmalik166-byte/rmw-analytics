# Single public origin (e.g. https://analytics.example.com):
#   /tracker.js, /api/v1/*  → API     /docs → static docs     everything else → dashboard
# Terminate TLS in front of this container (load balancer / Caddy / certbot) or see
# infrastructure/nginx/analytics.conf for a TLS-enabled host config.

limit_req_zone $binary_remote_addr zone=ingest:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=dash:10m rate=20r/s;

upstream api       { server api:4100;       keepalive 64; }
upstream dashboard { server dashboard:3100; keepalive 16; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 256k;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /tracker.js {
    proxy_pass http://api;
    proxy_cache_valid 200 10m;
  }

  location = /api/v1/events {
    limit_req zone=ingest burst=200 nodelay;
    proxy_pass http://api;
  }

  # Server-Sent Events: never buffer, long read timeout.
  location /api/v1/realtime/stream {
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
  }

  location /api/ {
    limit_req zone=dash burst=60 nodelay;
    proxy_pass http://api;
  }

  location = /health { proxy_pass http://api; access_log off; }

  location /docs/ {
    alias /usr/share/nginx/docs/;
    try_files $uri $uri/ $uri.html /docs/index.html;
  }

  location /_next/static/ {
    proxy_pass http://dashboard;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://dashboard;
  }
}
