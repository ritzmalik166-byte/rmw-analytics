name: Backend CI/CD

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    concurrency:
      group: backend-ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first run; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm ci
      - run: npm run build   # bundles tracker/dist (served by the API, used by tests)
      - run: npm test

  deploy:
    name: Deploy to droplet
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-analytics-backend
      cancel-in-progress: false
    steps:
      - name: Pull and restart on the droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: /var/www/deploy-analytics.sh

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://analytics-api.ritzmediaworld.com/health; then
              echo; echo "API healthy"; exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."; sleep 10
          done
          echo "::error::API did not become healthy after deploy"; exit 1
