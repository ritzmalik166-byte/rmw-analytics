# Host nginx config for a VM deployment (PM2 processes on localhost).
# Certificates: certbot --nginx -d analytics.example.com
limit_req_zone $binary_remote_addr zone=ingest:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=dash:10m rate=20r/s;

upstream analytics_api       { server 127.0.0.1:4100; keepalive 64; }
upstream analytics_dashboard { server 127.0.0.1:3100; keepalive 16; }

server {
  listen 80;
  server_name analytics.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name analytics.example.com;

  ssl_certificate     /etc/letsencrypt/live/analytics.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/analytics.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;

  client_max_body_size 256k;
  server_tokens off;
  gzip on;
  gzip_types application/json text/css application/javascript;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /tracker.js     { proxy_pass http://analytics_api; }
  location = /api/v1/events  { limit_req zone=ingest burst=200 nodelay; proxy_pass http://analytics_api; }
  location /api/v1/realtime/stream {
    proxy_pass http://analytics_api;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/   { limit_req zone=dash burst=60 nodelay; proxy_pass http://analytics_api; }
  location = /health { proxy_pass http://analytics_api; access_log off; }

  # Static docs: npm run build -w @rmw-analytics/docs (with DOCS_BASE_PATH=/docs), copy apps/docs/out here.
  location /docs/ { alias /var/www/analytics-docs/; try_files $uri $uri/ $uri.html =404; }

  location /_next/static/ { proxy_pass http://analytics_dashboard; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { proxy_pass http://analytics_dashboard; }
}
