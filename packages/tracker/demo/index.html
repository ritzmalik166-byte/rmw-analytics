<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker demo</title>
  <!-- 1. Optional pre-load stub: calls made before tracker.js loads are queued and replayed. -->
  <script>window.analytics = window.analytics || { q: [] }; ['track','trackSearch','identify','trackLead','page','consent'].forEach(function (m) { window.analytics[m] = window.analytics[m] || function () { window.analytics.q.push([m, [].slice.call(arguments)]); }; });</script>
  <!-- 2. The tracking snippet. Replace SITE_ID with a site created in the dashboard (its domain must allow localhost via allowedOrigins). -->
  <script defer src="../dist/tracker.js" data-site-id="site_replacewithyours" data-api="http://localhost:4100" data-debug="true"></script>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1e293b; }
    section { border: 1px solid #cbd5e1; border-radius: 4px; padding: 1rem; margin: 1rem 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #475569; margin: 0 0 .5rem; }
    input, select, button { font: inherit; padding: .3rem .5rem; margin: .2rem 0; }
    label { display: block; }
    .tall { height: 1200px; background: linear-gradient(#f8fafc, #e2e8f0); }
  </style>
</head>
<body>
  <h1 id="title">Tracker demo</h1>
  <p>Open the browser console (debug mode logs every event) and the dashboard's Real-time page.</p>

  <section>
    <h2>SPA navigation (History API)</h2>
    <button onclick="history.pushState({}, '', '/properties'); document.title = 'Properties'">/properties</button>
    <button onclick="history.pushState({}, '', '/project/sky-towers'); document.title = 'Sky Towers'">/project/sky-towers</button>
    <button onclick="history.back()">Back</button>
  </section>

  <section>
    <h2>Search (auto-detected)</h2>
    <form id="property-search" onsubmit="event.preventDefault()">
      <input type="search" name="q" placeholder="3 BHK Noida">
      <select name="category"><option value="residential">Residential</option><option value="commercial">Commercial</option></select>
      <button>Search</button>
    </form>
    <button onclick="analytics.trackSearch('2 BHK Sector 150', { category: 'rent', filters: { budget: '50L' }, results: 12 })">Manual trackSearch()</button>
  </section>

  <section>
    <h2>Lead form (allowlisted capture)</h2>
    <form id="enquiry" aria-label="Enquiry" data-analytics-lead data-analytics-fields="name,email,phone,city" data-analytics-mask="phone" onsubmit="event.preventDefault(); this.reset()">
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Phone <input name="phone" required></label>
      <label>City <input name="city"></label>
      <label>Password (never captured) <input name="password" type="password"></label>
      <label>OTP (never captured) <input name="otp"></label>
      <button>Send enquiry</button>
    </form>
  </section>

  <section>
    <h2>Links, clicks, media</h2>
    <p>
      <a href="https://www.example.org/partner">Outbound link</a> ·
      <a href="/brochures/sky-towers.pdf" onclick="event.preventDefault()">Brochure PDF</a> ·
      <a href="tel:+911234567890" onclick="event.preventDefault()">Call</a>
    </p>
    <button data-track="contact_click" data-track-project="sky-towers">Contact developer (data-track)</button>
    <button onclick="analytics.track('property_view', { propertyId: '182' })">analytics.track()</button>
    <button onclick="analytics.track('conversion', { goal: 'site_visit_booked', value: 25000, currency: 'INR' })">Conversion</button>
    <button onclick="analytics.identify({ customerId: 'CUS_10291', traits: { plan: 'gold' } })">identify()</button>
    <button onclick="nonExistentFunction()">Throw an error</button>
    <p><video controls width="320" title="Walkthrough" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video></p>
  </section>

  <div class="tall">Scroll for scroll-depth milestones…</div>
</body>
</html>
